name = "ocr"
# Wrangler bundles this entry directly; the @cloudflare/vite-plugin build also
# emits a bundled Worker under dist/ocr, which this deploy path does not use.
main = "src/worker.ts"
compatibility_date = "2026-05-19"

[assets]
binding = "ASSETS"
directory = "dist/client"
not_found_handling = "single-page-application"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
