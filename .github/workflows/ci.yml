name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Keep in lockstep with package.json "packageManager".
          bun-version: 1.4.0

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Generate route tree
        run: bunx @tanstack/router-cli generate

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test -- --coverage

      - name: Recognition regression guard
        # Runs the committed fixtures through the real decode path and fails if
        # an ASCII fixture no longer decodes exactly (model or pipeline swap).
        # Non-ASCII fixtures are report-only: see docs/upstream-rec-non-ascii.md.
        run: bun scripts/verify-rec-model.ts --guard

      - name: Build client
        run: bun run build

      - name: Validate Cloudflare Worker package
        # Validate the Worker package is well-formed. `versions upload --dry-run`
        # checks the same packaging step as production `wrangler deploy`.
        run: bunx wrangler versions upload --dry-run --outdir /tmp/worker-dist
